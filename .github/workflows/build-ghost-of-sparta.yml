name: "Teste Android — Ghost of Sparta (isolado)"
# Build manual e isolada de Ghost of Sparta; nunca reutiliza bibliotecas de Chains of Olympus.
on:
  workflow_dispatch:
  push:
    paths:
      - 'runtime/rt_fiber.c'
      - 'runtime/rt_android.c'
      - 'CMakeLists.txt'
      - '.github/workflows/build-ghost-of-sparta.yml'

permissions:
  contents: read
  actions: read

env:
  GAME_ID: UCUS98737
  SDL_COMMIT: fa2c02bb6e21974a89ea9824bc53c9932abe5f9c

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: libsdl-org/SDL
          ref: ${{ env.SDL_COMMIT }}
          path: SDL

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Baixar o disco pelo Google Drive
        run: |
          set -euo pipefail
          python3 -m pip install --break-system-packages -q gdown
          python3 -m gdown --fuzzy 'https://drive.google.com/file/d/1_LZlT3USCtfyBGkAazSqOTIdw0KazyUq/view?usp=drive_link' -O game.iso
          test -s game.iso
          SIZE="$(stat -c%s game.iso)"
          if [ "$SIZE" -le 50000000 ]; then
            echo "::error::Download incompleto ou arquivo inválido: $SIZE bytes. Confirme que o Drive está como 'Qualquer pessoa com o link — Leitor'."
            exit 1
          fi
          file game.iso
          echo "ISO baixada: $SIZE bytes"
                - name: Ferramentas do host (gow_disc)
        run: |
          cmake -S . -B build/cmake_tools -G Ninja -DCMAKE_BUILD_TYPE=Release -DGOW_TOOLS_ONLY=ON
          cmake --build build/cmake_tools --target gow_disc --parallel
          find build/cmake_tools -name gow_disc -type f

      - name: Decifrar o EBOOT do disco
        run: |
          DISC_TOOL="$(find build/cmake_tools -name gow_disc -type f | head -1)"
          mkdir -p build/eboot
          "$DISC_TOOL" --disc game.iso --id --decrypt-eboot "build/eboot/${GAME_ID}_EBOOT.BIN"
          ls -l build/eboot

      - name: Recompilar para C (recomp.py)
        run: |
          [ -f recomp/requirements.txt ] && python3 -m pip install --break-system-packages -q -r recomp/requirements.txt || true
          python3 -I recomp/recomp.py \
            --elf "build/eboot/${GAME_ID}_EBOOT.BIN" \
            --ghidra "re/out/recomp/${GAME_ID}_EBOOT.BIN.recomp.json" \
            --nids re/out/psp_nids_ppsspp.tsv \
            --out "build/gen/${GAME_ID}_full" \
            --difftest 0 --boot 0 --all
          ls -l "build/gen/${GAME_ID}_full" | head

      - name: libSDL3.so (arm64-v8a)
        run: |
          NDK="$ANDROID_NDK_LATEST_HOME"
          cmake -S SDL -B build-sdl -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF
          cmake --build build-sdl
          test -s build-sdl/libSDL3.so

      - name: libmain.so do jogo (arm64-v8a)
        run: |
          NDK="$ANDROID_NDK_LATEST_HOME"
          AR="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          mkdir -p stubs
          "$AR" rc stubs/libpthread.a
          "$AR" rc stubs/librt.a
          # O SDL já foi baixado pelo checkout dedicado acima; não crie symlink nem marcador dentro dele.
          cmake -S . -B build/cmake_android -G Ninja \
            -DFETCHCONTENT_SOURCE_DIR_SDL3:PATH="$PWD/SDL" \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DGAME="${GAME_ID}_full" -DGOW_ANDROID=ON \
            -DGOW_SDL_SO="$PWD/build-sdl/libSDL3.so" \
            -DCMAKE_SHARED_LINKER_FLAGS="-L$PWD/stubs" \
            -DCMAKE_EXE_LINKER_FLAGS="-L$PWD/stubs"
          cmake --build build/cmake_android --parallel
          find build/cmake_android -name 'libmain.so' -type f

      - name: Montar as 3 bibliotecas
        run: |
          NDK="$ANDROID_NDK_LATEST_HOME"
          mkdir -p pack/lib/arm64-v8a
          cp "$(find build/cmake_android -name libmain.so -type f | head -1)" pack/lib/arm64-v8a/
          cp build-sdl/libSDL3.so pack/lib/arm64-v8a/
          cp "$(find "$NDK/toolchains/llvm/prebuilt" -path '*aarch64-linux-android/libc++_shared.so' | head -1)" pack/lib/arm64-v8a/
          (cd pack && zip -qr "$RUNNER_TEMP/source-game.apk" lib)
          unzip -l "$RUNNER_TEMP/source-game.apk"

      - name: Shell SDL e launcher
        run: |
          printf '#include <SDL3/SDL_main.h>\nint main(int argc, char **argv) { (void)argc; (void)argv; return 0; }\n' > stub.c
          python3 SDL/build-scripts/create-android-project.py org.gow.shell stub.c --output "$RUNNER_TEMP/gow-android-project"
          APP="$RUNNER_TEMP/gow-android-project/org.gow.shell"
          cd "$APP"
          # Usa faixa alta para evitar INSTALL_FAILED_VERSION_DOWNGRADE ao instalar
          # sobre builds anteriores deste projeto que já tenham versionCode maior.
          RUN_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
          for f in app/build.gradle app/build.gradle.kts; do
            if [ -f "$f" ]; then
              sed -i -E "s/versionCode([ =]+)[0-9]+/versionCode\\1${RUN_VERSION_CODE}/" "$f"
              grep -n versionCode "$f" || true
            fi
          done
          ./gradlew --no-daemon assembleDebug

      - name: Empacotar e assinar o APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # Substitui a libmain de exemplo gerada pelo template SDL pela libmain real do jogo.
          mkdir -p "$RUNNER_TEMP/apk-overlay"
          cd "$RUNNER_TEMP/apk-overlay"
          unzip -q "$RUNNER_TEMP/gow-android-project/org.gow.shell/app/build/outputs/apk/debug/app-debug.apk"
          mkdir -p lib/arm64-v8a
          cp "$GITHUB_WORKSPACE/pack/lib/arm64-v8a/libmain.so" lib/arm64-v8a/libmain.so
          cp "$GITHUB_WORKSPACE/pack/lib/arm64-v8a/libc++_shared.so" lib/arm64-v8a/libc++_shared.so
          echo "Bibliotecas ARM64 finais no APK:"
          ls -lh lib/arm64-v8a/
          zip -qr "$RUNNER_TEMP/unsigned.apk" .
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$RUNNER_TEMP/unsigned.apk" "$RUNNER_TEMP/aligned.apk"
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/gow.keystore"
            KS="$RUNNER_TEMP/gow.keystore"; ALIAS=gow; export SIGN_PASS="$KS_PASS"
            echo "assinando com a chave fixa (atualiza por cima do app instalado)"
          else
            echo "::warning::sem keystore fixo nos secrets: usando chave temporaria (o Android vai exigir desinstalar)"
            keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/test.keystore" \
              -storepass android -keypass android -alias androiddebugkey \
              -dname "CN=Android Debug,O=Android,C=US" -validity 10000 -keyalg RSA -keysize 2048
            KS="$RUNNER_TEMP/test.keystore"; ALIAS=androiddebugkey; export SIGN_PASS=android
          fi
          "$BUILD_TOOLS/apksigner" sign --ks "$KS" --ks-key-alias "$ALIAS" \
            --ks-pass env:SIGN_PASS --key-pass env:SIGN_PASS \
            --out "$RUNNER_TEMP/GodOfWar-GhostOfSparta-test.apk" "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose "$RUNNER_TEMP/GodOfWar-GhostOfSparta-test.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: GodOfWar-GhostOfSparta-apk-${{ github.run_number }}
          path: ${{ runner.temp }}/GodOfWar-GhostOfSparta-test.apk
          if-no-files-found: error
          retention-days: 1
