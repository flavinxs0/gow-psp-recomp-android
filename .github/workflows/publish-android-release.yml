name: "Publicar lançamento APK Android / Publish Android APK Release"

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag do lançamento (use uma nova tag por versão) / Release tag (use a new tag for each version)"
        required: true
        type: string
        default: "android-v0.1.0"
      target_branch:
        description: "Branch que contém o código desta versão / Branch whose code this release represents"
        required: true
        type: string
        default: "android"
      release_title:
        description: "Título exibido no lançamento do GitHub / Title shown on the GitHub Release"
        required: true
        type: string
        default: "God of War PSP Recomp Android — v0.1.0"
      apk_url:
        description: "Link HTTPS direto para baixar o APK testado (não uma página) / Direct HTTPS download URL of the tested APK (not a webpage)"
        required: true
        type: string
      prerelease:
        description: "Marcar como pré-lançamento/versão de teste / Mark as a pre-release / testing build"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Validar dados e baixar APK / Validate inputs and download APK
        env:
          APK_URL: ${{ inputs.apk_url }}
        shell: bash
        run: |
          set -euo pipefail
          case "$APK_URL" in
            https://*) ;;
            *) echo "apk_url precisa ser um link HTTPS direto para download. / apk_url must be a direct HTTPS download URL." >&2; exit 1 ;;
          esac
          mkdir -p release
          curl --fail --location --retry 3 --output release/GodOfWar-PSP-Recomp-Android.apk "$APK_URL"
          if [ ! -s release/GodOfWar-PSP-Recomp-Android.apk ]; then
            echo "O APK baixado está vazio. / Downloaded APK is empty." >&2
            exit 1
          fi
          if ! unzip -tq release/GodOfWar-PSP-Recomp-Android.apk >/dev/null; then
            echo "O arquivo baixado não é um APK/arquivo ZIP válido. / The downloaded file is not a valid APK/ZIP archive." >&2
            exit 1
          fi
          if ! unzip -Z1 release/GodOfWar-PSP-Recomp-Android.apk | grep -qx 'AndroidManifest.xml'; then
            echo "O arquivo não contém AndroidManifest.xml; publicação cancelada. / The archive does not contain AndroidManifest.xml; refusing to publish it as an APK." >&2
            exit 1
          fi
          sha256sum release/GodOfWar-PSP-Recomp-Android.apk | tee release/SHA256SUMS.txt

      - name: Publicar lançamento no GitHub / Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          target_commitish: ${{ inputs.target_branch }}
          name: ${{ inputs.release_title }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          body: |
            ## 🇧🇷 Português

### Lançamento do APK Android

Esta versão publica um APK Android do projeto God of War PSP Recomp Android.

### Importante
- Esta é uma versão inicial para testes; compatibilidade e estabilidade podem variar conforme o aparelho.
- O APK é fornecido a este workflow por um link HTTPS direto e passa por verificações básicas de estrutura.
- O checksum SHA-256 está incluído em `SHA256SUMS.txt`.
- Nenhuma imagem de disco ou dado proprietário do jogo está incluído. Use apenas dados de jogo que você tenha direito legal de utilizar.

### Relatar problemas
Abra uma issue com o modelo do aparelho, a versão do Android, os passos para reproduzir e logs relevantes. Não envie imagens de disco ou arquivos proprietários do jogo.

---

## 🇺🇸 English

### First Android APK release

            This release publishes an Android APK for the God of War PSP Recomp Android project.

            ### Important
            - This is an initial testing release; compatibility and stability may vary by device.
            - The APK is supplied to this workflow by a direct HTTPS download URL and is checked for basic APK archive structure before publication.
            - The SHA-256 checksum is included as `SHA256SUMS.txt`.
            - No game disc image or proprietary game data is included. Use only game data you are legally entitled to use.

            ### Reporting issues
            Please open an issue with your device model, Android version, steps to reproduce, and relevant logs. Do not upload game disc images or proprietary game files.
          files: |
            release/GodOfWar-PSP-Recomp-Android.apk
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
